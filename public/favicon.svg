<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017"/>
      <stop offset="50%" stop-color="#101b2b"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#f5e6a3"/>
      <stop offset="100%" stop-color="#b89324"/>
    </linearGradient>
  </defs>
  <!-- Background circle with dark Sauvage midnight blue -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#metal)" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Sauvage Dior Monogram -->
  <g fill="url(#metal)" text-anchor="middle">
    <text x="64" y="58" font-family="'Cinzel', 'Times New Roman', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="4">CD</text>
    <text x="64" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="5" fill="#f5f5f5">SAUVAGE</text>
    <text x="64" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="400" letter-spacing="3" fill="#a0aec0">DIOR</text>
  </g>
</svg>